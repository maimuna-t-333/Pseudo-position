<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore basic css</title>
    <style>
        #style{
            font-size: large;
        }
        #bold{
            text-align: center;
        }
        p{
            background-color: cadetblue;
            width: 50%;
        }
        li{
            color: rgb(133, 97, 97);
        }
        .Player{
            text-align: right;
        }

    </style>
</head>
<body>
    <h2 style="color: brown;">Learing basic css</h2>
    <p style="background-color: bisque;">Inline css</p>
    <p>Css meaning: cascading style sheet</p>
    <p id="style">style is colourful</p>
    <p>short form is css</p>
    <p id="bold">Needs style rule and value separeted by colon(:)</p>
    <p class="Player">after each styles you need to use semi-colom(;)</p>
    <ul>
        <li>inline</li>
        <li>internal or embadded</li>
        <li>external</li>
    </ul>
</body>
</html>
